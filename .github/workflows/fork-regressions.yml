name: Fork Core regressions

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-core-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOWORK: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: ''
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify fixed host toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION)" = go1.26.3
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          git submodule status --recursive
      - name: Run reviewed Core regression allowlist
        shell: bash
        run: |
          set -euo pipefail
          # No service startup, module-root, ./..., hot-reload, Apple or old XUDP fixture.
          # The Dart-generated AppRoundTrip case is exercised separately by the App job.
          # Both packages import libbox. Match its existing production linker contract
          # (Makefile LDFLAGS and sing-box release/LDFLAGS), not additional source tags.
          printf '%s\n' 'Core allowlist uses existing production -checklinkname=0 (binary-wide linkname relaxation); private profiler ABI remains untested'
          run() {
            local log
            log=$(mktemp "$RUNNER_TEMP/hiddify-core-go.XXXXXX")
            go test -json -tags='' -mod=readonly -count=1 -timeout=120s -p=2 -parallel=2 \
              -ldflags=-checklinkname=0 -run "$2" "$1" | tee "$log"
            python3 - "$log" "$3" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          ran = {e['Test'] for e in events if e.get('Action') == 'run' and '/' not in e.get('Test', '/')}
          passed = {e['Test'] for e in events if e.get('Action') == 'pass' and '/' not in e.get('Test', '/')}
          skipped = [e['Test'] for e in events if e.get('Action') == 'skip' and e.get('Test')]
          if len(ran) != int(sys.argv[2]) or passed != ran or skipped:
              raise SystemExit(f'incomplete allowlist: ran={len(ran)}, passed={len(passed)}, skipped={skipped}')
          print(f'Verified {len(passed)} completed top-level allowlist tests; no skipped cases')
          PY
          }
          run ./v2/config '^(TestProxyEncryptedDNSResolver|TestBuildConfig(FakeDNSWithIPv4OnlyBootstrapStarts|DNSStrategyCompatibility|AppDirectDNSStrategyCompatibility)|TestPreserveDomainForFallbackProxy(OptionsJSON|BuildMatrix|FakeDNSOnUnchanged|SubscriptionHeadersCannotOptIn))$' 8
          run ./v2/hcore '^(TestIOSRuntimeMemoryLimit|TestIOSRuntimeMemoryLimitReappliedAfterSetup|TestNonIOSRuntimeMemoryPolicyUnchanged|TestServiceOptionsEnableIOSMemoryProtection|TestStartService_(CancelledRequestContext|PreCancelledPreservesLifecycle|CancelledWhileLockHeldPreservesLifecycle))$' 7
      - name: Verify module locks remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- go.mod go.sum
          git submodule foreach --recursive 'git diff --exit-code -- go.mod go.sum'
